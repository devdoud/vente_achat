name: achat_vente
description: "Bien être"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  another_flushbar: ^1.12.31-dev.1
  dio: ^5.8.0+1
  injectable:
  get_it:
  flutter_form_builder: 10.3.0+2
  form_builder_validators: ^11.1.1
  auto_route: ^9.2.2
  cached_network_image: ^3.4.1
  dartz: ^0.10.1
  flutter_svg: ^2.0.16
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  webview_flutter: ^4.10.0
  flutter_bloc: ^8.1.6
  hydrated_bloc: ^9.1.5
  overlay_support: ^2.1.0
  share_plus: ^10.1.3
  provider: ^6.1.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  firebase_crashlytics: ^4.2.0
  firebase_core: ^3.9.0
  logging: ^1.3.0
  flutter_localizations:
    sdk: flutter
  intl: any
  form_builder_image_picker: ^4.1.0
  image_picker: ^1.1.2
  google_maps_flutter:
  http: ^1.3.0
  flutter_polyline_points:
  geocoding:
  flutter_typeahead:
  permission_handler: ^12.0.0+1
  location: ^8.0.0
  flutter_hooks: ^0.21.2
  geolocator: ^14.0.0
  uuid: ^4.5.1
  sliding_up_panel: ^2.0.0+1
  flutter_dotenv: ^5.2.1
  drop_down_list: ^2.0.0
  easy_rich_text: ^2.2.0
  syncfusion_flutter_charts: ^29.2.11
  dotted_border: ^3.0.1
  just_audio: ^0.10.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  lint: ^1.10.0
  # add the generator to your dev_dependencies
  injectable_generator:
  # add build runner if not already added
  build_runner:
  auto_route_generator: ^9.0.0
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/img/breath_maps.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"

flutter_native_splash:
  image: assets/img/breath_maps.png
  color: "#ffffff"
  android_12:
    image: assets/img/breath_maps.png
    color: "#ffffff"
    icon_background_color: "#ffffff"

flutter:
  uses-material-design: true
  generate: true # Add this line
  fonts:
    - family: Montserrat
      fonts:
        - asset: font/montserrat/light.ttf
          weight: 300
        - asset: font/montserrat/regular.ttf
          weight: 400
        - asset: font/montserrat/semibold.ttf
          weight: 600
        - asset: font/montserrat/medium.ttf
          weight: 700
        - asset: font/montserrat/bold.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: font/nunito/light.ttf
          weight: 300
        - asset: font/nunito/regular.ttf
          weight: 400
        - asset: font/nunito/semibold.ttf
          weight: 600
        - asset: font/nunito/medium.ttf
